<title>Ranked Saturday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --ground: #F2F5F0;
    --surface: #FFFFFF;
    --surface-2: #E9EEE7;
    --ink: #16211B;
    --muted: #5D6C63;
    --line: #D3DBD2;
    --line-strong: #B5C0B4;
    --accent: #1E7A44;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEFE2;
    --gold: #B8860B;
    --gold-soft: #F6ECCF;
    --gold-ink: #5A4100;
    --b1g: #2B4C9B; --b1g-soft: #DDE5F7;
    --sec: #B4322F; --sec-soft: #F8DCDA;
    --acc: #1E6B8C; --acc-soft: #D8EAF2;
    --b12: #6F4B9C; --b12-soft: #E8DFF3;
    --oth: #5D6C63; --oth-soft: #E4E9E2;
    --focus: #1E7A44;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1512; --surface: #17201B; --surface-2: #1F2A23;
      --ink: #E6ECE5; --muted: #93A398; --line: #2B3830; --line-strong: #3E4D44;
      --accent: #43B96F; --accent-ink: #0B1A10; --accent-soft: #1C3527;
      --gold: #E0B23E; --gold-soft: #3A2E10; --gold-ink: #F3DFA6;
      --b1g: #8FAAF0; --b1g-soft: #1C2A4C; --sec: #F08C88; --sec-soft: #4A1F1E;
      --acc: #7CC3E0; --acc-soft: #163444; --b12: #C4A6EA; --b12-soft: #33244A;
      --oth: #A6B4AA; --oth-soft: #26302A; --focus: #43B96F;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E1512; --surface: #17201B; --surface-2: #1F2A23;
    --ink: #E6ECE5; --muted: #93A398; --line: #2B3830; --line-strong: #3E4D44;
    --accent: #43B96F; --accent-ink: #0B1A10; --accent-soft: #1C3527;
    --gold: #E0B23E; --gold-soft: #3A2E10; --gold-ink: #F3DFA6;
    --b1g: #8FAAF0; --b1g-soft: #1C2A4C; --sec: #F08C88; --sec-soft: #4A1F1E;
    --acc: #7CC3E0; --acc-soft: #163444; --b12: #C4A6EA; --b12-soft: #33244A;
    --oth: #A6B4AA; --oth-soft: #26302A; --focus: #43B96F;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 15px; line-height: 1.45;
    padding-inline: clamp(16px, 4vw, 40px); padding-block: 0 56px;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; }

  /* Header: scoreboard strip */
  .masthead {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 12px 24px; padding-block: 28px 18px; border-bottom: 3px solid var(--ink);
  }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 7vw, 64px); line-height: .95; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
  .masthead .meta { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; line-height: 1.6; }
  .masthead .meta strong { color: var(--ink); font-weight: 500; }
  .basis { margin: 14px 0 0; max-width: 68ch; color: var(--muted); font-size: 14px; }

  /* Toolbar */
  .toolbar {
    position: sticky; top: 0; z-index: 5; background: var(--ground);
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    padding-block: 12px; border-bottom: 1px solid var(--line);
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .group > .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 500;
    padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); white-space: nowrap;
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .seg button:disabled { color: var(--muted); cursor: not-allowed; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; }
  .chk input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .chk.off { opacity: .45; }
  .toolbar .spacer { flex: 1; }

  /* Summary strip */
  .strip {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0;
    margin-top: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden;
  }
  .stat { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0; }
  .stat:last-child { border-right: 0; }
  .stat .k { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-family: var(--display); font-size: 30px; font-weight: 600; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat.head { grid-column: span 2; }
  .stat.head .v { font-size: 22px; line-height: 1.15; text-transform: none; font-family: var(--body); font-weight: 600; }
  .stat.head .v small { display: block; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 3px; }

  /* Rundown */
  .rundown { margin-top: 26px; }
  .day { margin-top: 22px; }
  .day h2 { font-family: var(--display); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 8px; display: flex; align-items: baseline; gap: 12px; }
  .day h2 .n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
  .table { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .row {
    display: grid; grid-template-columns: 92px 84px 1fr 150px; align-items: center; gap: 0 14px;
    padding: 10px 14px 10px 0; border-top: 1px solid var(--line); position: relative;
  }
  .row:first-child { border-top: 0; }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--stripe, transparent); }
  .row .time { font-family: var(--mono); font-size: 14px; padding-left: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .time small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .row .tv { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .match { min-width: 0; }
  .teams { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 16px; }
  .teams .sep { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .team { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .team .rk { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--gold-ink); background: var(--gold-soft); border-radius: 3px; padding: 1px 5px; }
  .team .nm { font-weight: 600; }
  .team.unranked .nm { font-weight: 500; }
  .team .conf { font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; background: var(--oth-soft); color: var(--oth); }
  .conf.b1g { background: var(--b1g-soft); color: var(--b1g); }
  .conf.sec { background: var(--sec-soft); color: var(--sec); }
  .conf.acc { background: var(--acc-soft); color: var(--acc); }
  .conf.b12 { background: var(--b12-soft); color: var(--b12); }
  .sub { margin-top: 3px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .sub .other { font-family: var(--mono); font-size: 11.5px; }
  .sub .final { color: var(--ink); font-weight: 500; }
  .row .tier { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .pill { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--oth-soft); color: var(--oth); white-space: nowrap; }
  .pill.marquee { background: var(--gold); color: var(--accent-ink); }
  .pill.duel { background: var(--gold-soft); color: var(--gold-ink); }
  .pill.power { background: var(--accent-soft); color: var(--accent); }
  .pill.pm { background: var(--surface-2); color: var(--ink); }
  .meter { width: 110px; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .row.is-marquee .meter i { background: var(--gold); }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; border: 1px dashed var(--line-strong); border-radius: 8px; margin-top: 22px; }

  /* Poll board */
  .board { margin-top: 40px; }
  .board h2 { font-family: var(--display); font-size: 26px; font-weight: 700; text-transform: uppercase; margin: 0 0 4px; }
  .board p.lede { margin: 0 0 12px; color: var(--muted); max-width: 70ch; }
  .polls { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .poll { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .poll h3 { margin: 0; padding: 10px 14px; font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
  .poll h3 small { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
  .poll ol { list-style: none; margin: 0; padding: 0; }
  .poll li { display: grid; grid-template-columns: 34px 1fr; gap: 0 8px; padding: 6px 12px; border-top: 1px solid var(--line); align-items: start; }
  .poll li:first-child { border-top: 0; }
  .poll li .r { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .poll li .t { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .poll li .t .nm { font-weight: 600; }
  .poll li .t .inf { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .poll li .wk { grid-column: 2; font-size: 12.5px; color: var(--muted); }
  .poll li .wk b { font-weight: 500; color: var(--ink); }
  .poll .pending { padding: 18px 14px; color: var(--muted); font-size: 14px; }
  .poll .pending strong { color: var(--ink); font-weight: 600; }

  .notes { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 13.5px; max-width: 78ch; }
  .notes h2 { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; color: var(--muted); }
  .notes ul { margin: 0 0 12px; padding-left: 18px; }
  .notes li { margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; align-items: center; }

  @media (max-width: 720px) {
    .row { grid-template-columns: 74px 1fr; gap: 4px 10px; padding-right: 10px; }
    .row .time { font-size: 13px; padding-left: 14px; }
    .row .tv { grid-column: 1; grid-row: 2; padding-left: 14px; }
    .row .match { grid-column: 2; grid-row: 1 / span 2; }
    .row .tier { grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; align-items: center; padding-left: 14px; margin-top: 4px; }
    .stat.head { grid-column: 1 / -1; }
    .masthead .meta { text-align: left; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .seg button, .meter i { transition: background-color .15s ease, width .25s ease; }
  }
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <p class="eyebrow" id="eyebrow">NCAA FBS · 2026 season</p>
      <h1>Ranked Saturday</h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <p class="basis" id="basis"></p>

  <nav class="toolbar" aria-label="Filters">
    <div class="group">
      <span class="lbl">Show</span>
      <div class="seg" role="group" aria-label="Scope">
        <button type="button" id="scope-top25" data-scope="top25" aria-pressed="true">Top 25, all conferences</button>
        <button type="button" id="scope-quality" data-scope="quality" aria-pressed="false">Big Ten + SEC</button>
      </div>
    </div>
    <div class="group">
      <span class="lbl">Rank by</span>
      <div class="seg" role="group" aria-label="Poll basis" id="poll-seg"></div>
    </div>
    <label class="chk" id="rvr-wrap"><input type="checkbox" id="rvr"> Ranked vs. ranked only</label>
    <label class="chk off" id="ranked-only-wrap"><input type="checkbox" id="ranked-only"> Ranked teams only</label>
    <span class="spacer"></span>
    <div class="group">
      <span class="lbl">Order</span>
      <div class="seg" role="group" aria-label="Sort">
        <button type="button" id="sort-time" data-sort="time" aria-pressed="true">Kickoff</button>
        <button type="button" id="sort-quality" data-sort="quality" aria-pressed="false">Matchup quality</button>
      </div>
    </div>
  </nav>

  <section class="strip" id="strip" aria-live="polite"></section>
  <section class="rundown" id="rundown"></section>

  <section class="board">
    <h2>Poll board</h2>
    <p class="lede" id="board-lede"></p>
    <div class="polls" id="polls"></div>
  </section>

  <section class="notes" id="notes"></section>
</div>

<script>
(function () {
  const DATA = __DATA_JSON__;
  const POLL_ORDER = ["ap", "coaches", "cfp"];
  const CONF_CLASS = { "Big Ten": "b1g", "SEC": "sec", "ACC": "acc", "Big 12": "b12" };
  const TIER_CLASS = { "Marquee": "marquee", "Ranked duel": "duel", "Power test": "power", "Power matchup": "pm", "Tune-up": "", "Light": "" };
  const STRIPE = { "Marquee": "var(--gold)", "Ranked duel": "var(--gold)", "Power test": "var(--accent)", "Power matchup": "var(--line-strong)" };

  const state = { scope: "top25", poll: DATA.default_poll, rvr: false, rankedOnly: false, sort: "time" };
  try {
    const saved = JSON.parse(localStorage.getItem("ranked-saturday") || "{}");
    if (saved.scope) state.scope = saved.scope;
    if (saved.poll && DATA.polls[saved.poll] && DATA.polls[saved.poll].ranks.length) state.poll = saved.poll;
    state.rvr = !!saved.rvr; state.rankedOnly = !!saved.rankedOnly;
    if (saved.sort) state.sort = saved.sort;
  } catch (e) {}
  function persist() { try { localStorage.setItem("ranked-saturday", JSON.stringify(state)); } catch (e) {} }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function fmtTime(t) {
    const [h, m] = t.split(":").map(Number);
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return (m ? `${h12}:${String(m).padStart(2, "0")}` : `${h12}`) + (h < 12 ? " am" : " pm");
  }
  function fmtDate(iso) {
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
  }
  function confChip(conf) {
    const cls = CONF_CLASS[conf] || "";
    return `<span class="conf ${cls}">${esc(conf)}</span>`;
  }
  function teamHtml(name, rank, conf) {
    return `<span class="team ${rank ? "" : "unranked"}">${rank ? `<span class="rk">No. ${rank}</span>` : ""}<span class="nm">${esc(name)}</span>${confChip(conf)}</span>`;
  }
  function otherRanks(g) {
    const parts = [];
    for (const key of POLL_ORDER) {
      if (key === state.poll || !DATA.polls[key].ranks.length) continue;
      const r = g.ranks[key];
      if (!r.away && !r.home) continue;
      const short = DATA.polls[key].short;
      const a = r.away ? `${esc(g.away)} ${r.away}` : null;
      const h = r.home ? `${esc(g.home)} ${r.home}` : null;
      parts.push(`${short}: ${[a, h].filter(Boolean).join(", ")}`);
    }
    return parts.join(" · ");
  }

  function visible() {
    const key = state.poll;
    return DATA.games.filter(g => {
      const r = g.ranks[key];
      const anyRanked = !!(r.away || r.home);
      const both = !!(r.away && r.home);
      if (state.rvr && !both) return false;
      if (state.scope === "top25") return anyRanked;
      if (!g.quality_conf) return false;
      if (state.rankedOnly && !anyRanked) return false;
      return true;
    });
  }

  function rowHtml(g) {
    const key = state.poll, r = g.ranks[key], tier = g.tier[key], score = g.score[key];
    const stripe = STRIPE[tier] ? `style="--stripe:${STRIPE[tier]}"` : "";
    const sep = g.neutral ? "vs." : "at";
    const sub = [];
    if (g.result) sub.push(`<span class="final">Final: ${esc(g.result)}</span>`);
    if (g.note) sub.push(`<span>${esc(g.note)}</span>`);
    if (g.conference_game) sub.push(`<span>${esc(g.away_conf)} game</span>`);
    const other = otherRanks(g);
    if (other) sub.push(`<span class="other">${other}</span>`);
    return `<div class="row ${tier === "Marquee" ? "is-marquee" : ""}" ${stripe}>
      <div class="time">${state.sort === "quality" ? `<small>${esc(g.day)}</small>` : ""}${fmtTime(g.time_et)}<small>ET</small></div>
      <div class="tv" title="${esc(g.tv)}">${esc(g.tv)}</div>
      <div class="match">
        <div class="teams">${teamHtml(g.away, r.away, g.away_conf)}<span class="sep">${sep}</span>${teamHtml(g.home, r.home, g.home_conf)}</div>
        ${sub.length ? `<div class="sub">${sub.join("")}</div>` : ""}
      </div>
      <div class="tier"><span class="pill ${TIER_CLASS[tier] || ""}">${esc(tier)}</span><span class="meter" title="Matchup quality ${score} of 50"><i style="width:${Math.round(score / 50 * 100)}%"></i></span></div>
    </div>`;
  }

  function renderRundown(games) {
    const el = document.getElementById("rundown");
    if (!games.length) {
      el.innerHTML = `<div class="empty">No games match these filters this week. Try widening the scope or turning off “ranked vs. ranked”.</div>`;
      return;
    }
    if (state.sort === "quality") {
      const sorted = games.slice().sort((a, b) => b.score[state.poll] - a.score[state.poll] || a.date.localeCompare(b.date) || a.time_et.localeCompare(b.time_et));
      el.innerHTML = `<div class="day"><h2>By matchup quality <span class="n">${sorted.length} games</span></h2><div class="table">${sorted.map(rowHtml).join("")}</div></div>`;
      return;
    }
    const byDate = new Map();
    for (const g of games.slice().sort((a, b) => a.date.localeCompare(b.date) || a.time_et.localeCompare(b.time_et))) {
      if (!byDate.has(g.date)) byDate.set(g.date, []);
      byDate.get(g.date).push(g);
    }
    el.innerHTML = [...byDate.entries()].map(([date, list]) =>
      `<div class="day"><h2>${esc(fmtDate(date))} <span class="n">${list.length} game${list.length === 1 ? "" : "s"}</span></h2><div class="table">${list.map(rowHtml).join("")}</div></div>`
    ).join("");
  }

  function renderStrip(games) {
    const key = state.poll;
    const both = games.filter(g => g.ranks[key].away && g.ranks[key].home).length;
    const confGames = games.filter(g => g.conference_game).length;
    const top = games.slice().sort((a, b) => b.score[key] - a.score[key])[0];
    let head = "—", headSub = "";
    if (top) {
      const r = top.ranks[key];
      head = `${r.away ? "No. " + r.away + " " : ""}${top.away} ${top.neutral ? "vs." : "at"} ${r.home ? "No. " + r.home + " " : ""}${top.home}`;
      headSub = `${top.day} ${fmtTime(top.time_et)} ET · ${top.tv}`;
    }
    document.getElementById("strip").innerHTML = `
      <div class="stat"><div class="k">Games shown</div><div class="v">${games.length}</div></div>
      <div class="stat"><div class="k">Ranked vs. ranked</div><div class="v">${both}</div></div>
      <div class="stat"><div class="k">Conference games</div><div class="v">${confGames}</div></div>
      <div class="stat head"><div class="k">Headliner</div><div class="v">${esc(head)}<small>${esc(headSub)}</small></div></div>`;
  }

  function renderPolls() {
    const wk = DATA.this_week;
    const html = POLL_ORDER.map(key => {
      const p = DATA.polls[key];
      if (!p.ranks.length) {
        const first = new Date(DATA.cfp_first_release + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
        return `<div class="poll"><h3>${esc(p.name)} <small>not yet released</small></h3><div class="pending">The selection committee publishes its first Top 25 on <strong>${esc(first)}</strong>. From that week on it becomes the default basis here.</div></div>`;
      }
      const inferred = new Set(p.inferred || []);
      const items = p.ranks.map(([team, rank]) => {
        const t = DATA.teams[team] || { conf: "" };
        const w = wk[team];
        const wkHtml = w
          ? `<div class="wk">${w.at ? "at" : "vs."} <b>${esc(w.opponent)}</b> · ${esc(w.date.slice(5).replace("-", "/"))} ${fmtTime(w.time_et)} ET · ${esc(w.tv)}</div>`
          : `<div class="wk">Idle this week</div>`;
        return `<li><span class="r">${rank}</span><span class="t"><span class="nm">${esc(team)}</span>${confChip(t.conf)}${inferred.has(team) ? `<span class="inf" title="Slot placed by elimination; see notes">slot inferred</span>` : ""}</span>${wkHtml}</li>`;
      }).join("");
      return `<div class="poll"><h3>${esc(p.name)} <small>released ${esc(p.released)}</small></h3><ol>${items}</ol></div>`;
    }).join("");
    document.getElementById("polls").innerHTML = html;
  }

  function renderPollSeg() {
    const seg = document.getElementById("poll-seg");
    seg.innerHTML = POLL_ORDER.map(key => {
      const p = DATA.polls[key];
      const dis = !p.ranks.length;
      return `<button type="button" id="poll-${key}" data-poll="${key}" aria-pressed="${state.poll === key}" ${dis ? `disabled title="First CFP Top 25 comes ${DATA.cfp_first_release}"` : ""}>${esc(p.short)}</button>`;
    }).join("");
    seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { state.poll = b.dataset.poll; update(); }));
  }

  function renderStatic() {
    document.getElementById("eyebrow").textContent = `NCAA FBS · ${DATA.season} season · ${DATA.week_label}`;
    const poll = DATA.polls[DATA.default_poll];
    document.getElementById("meta").innerHTML = `<strong>${esc(DATA.window)}</strong><br>Basis: ${esc(poll.name)}, released ${esc(poll.released)}<br>Updated ${esc(DATA.generated_at)} · refreshes Thursdays`;
    document.getElementById("basis").textContent = DATA.basis_note;
    document.getElementById("board-lede").textContent = "Both polls side by side, with each ranked team's game this week. Matchup quality on the rundown is the sum of (26 − rank) for ranked teams, plus 3 for an unranked power-conference team, 1 for a Group of Five team and 0 for FCS, on a 50-point scale.";
    const notes = document.getElementById("notes");
    notes.innerHTML = `<h2>Notes and sources</h2><ul>${(DATA.notes || []).map(n => `<li>${esc(n)}</li>`).join("")}</ul>
      <div class="legend"><span class="pill marquee">Marquee</span> both ranked, one in the top 10 &nbsp; <span class="pill duel">Ranked duel</span> both ranked &nbsp; <span class="pill power">Power test</span> ranked vs. unranked power team &nbsp; <span class="pill">Tune-up</span> ranked vs. Group of Five or FCS &nbsp; <span class="pill pm">Power matchup</span> two unranked power teams</div>
      <p style="margin-top:12px">Sources: ${(DATA.sources || []).map(esc).join("; ")}.</p>`;
  }

  function update() {
    document.querySelectorAll("[data-scope]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.scope === state.scope)));
    document.querySelectorAll("[data-sort]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sort === state.sort)));
    document.querySelectorAll("[data-poll]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.poll === state.poll)));
    document.getElementById("rvr").checked = state.rvr;
    document.getElementById("ranked-only").checked = state.rankedOnly;
    const ro = document.getElementById("ranked-only-wrap");
    ro.classList.toggle("off", state.scope !== "quality");
    document.getElementById("ranked-only").disabled = state.scope !== "quality";
    const games = visible();
    renderStrip(games);
    renderRundown(games);
    persist();
  }

  document.querySelectorAll("[data-scope]").forEach(b => b.addEventListener("click", () => { state.scope = b.dataset.scope; update(); }));
  document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => { state.sort = b.dataset.sort; update(); }));
  document.getElementById("rvr").addEventListener("change", e => { state.rvr = e.target.checked; update(); });
  document.getElementById("ranked-only").addEventListener("change", e => { state.rankedOnly = e.target.checked; update(); });

  renderStatic();
  renderPollSeg();
  renderPolls();
  update();
})();
</script>
